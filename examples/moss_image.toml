# MOSS-Image-Base, text-to-image only. Read docs/maintained-branch.md before training.
# Do not point diffusion_model at an SFT checkpoint if you want the base training setup.
# The text encoder is Qwen3.5-9B, about 19GB in bf16. Caching frees it afterwards.

output_dir = '/path/to/desired/output/folder'
dataset = 'examples/dataset.toml'

epochs = 1000
micro_batch_size_per_gpu = 1
pipeline_stages = 1
gradient_accumulation_steps = 4
gradient_clipping = 1
eval_every_n_epochs = 1
eval_before_first_step = true
eval_micro_batch_size_per_gpu = 1
eval_gradient_accumulation_steps = 1
save_every_n_epochs = 5
checkpoint_every_n_minutes = 120
activation_checkpointing = true
partition_method = 'parameters'
save_dtype = 'bfloat16'
caching_batch_size = 1
steps_per_print = 1
# blocks_to_swap = 20

[model]
type = 'moss_image'
diffusion_model = '/path/to/moss-image-base.safetensors'
vae = '/path/to/flux2-vae.safetensors'
text_encoders = [
    {path = '/path/to/qwen3.5_9b.safetensors', type = 'moss_image'}
]
dtype = 'bfloat16'
diffusion_model_dtype = 'float8'
timestep_sample_method = 'logit_normal'
shift = 5

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'automagic'
weight_decay = 0.01
